version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: computer-club-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: computerclub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: computer-club-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod # Включаем боевой профиль с PostgreSQL
    depends_on:
      - postgres

volumes:
  postgres_data:
